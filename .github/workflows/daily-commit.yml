name: Daily Green Commit

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  water-plant:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Water the plant
        run: |
          echo "Date: $(date +'%Y-%m-%d %H:%M:%S')" >> water.log
          echo "- $(date +'%Y-%m-%d') 🌱 今天也有好好浇水哦" >> README.md

      - name: Commit and push
        run: |
          git config user.name "HuangSixiang"
          git config user.email "2876754681@qq.com"
          git add -A
          git diff --quiet && git diff --staged --quiet && echo "No changes" || (git commit -m "🌱 daily watering - $(date +'%Y-%m-%d')" && git push)
